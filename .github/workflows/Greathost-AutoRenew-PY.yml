name: Greathost-AutoRenew-PY

on:
  schedule:
    - cron: '0 */8 * * *'  # 每8小时运行一次
  workflow_dispatch:        # 允许手动运行

jobs:
  Auto_renew_greathost:
    runs-on: ubuntu-latest
    
    permissions:
      actions: write
      contents: write   # 允许修改 README.md 并推送   
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Chrome 
        uses: browser-actions/setup-chrome@v2 
        with: 
          chrome-version: 'stable' 
      # 3. 安装依赖 
      # 注意：必须安装 selenium-wire, blinker(特定版本防报错), requests 
      - name: Install dependencies 
        run: | 
          python -m pip install --upgrade pip 
          pip install selenium==4.18.1 selenium-wire==5.1.0 blinker==1.7.0 requests cryptography==41.0.7 pyOpenSSL==23.2.0

      # 4. 运行 Python 脚本
      - name: Run renew script
        env:
          GREATHOST_EMAIL: ${{ secrets.GREATHOST_EMAIL }}
          GREATHOST_PASSWORD: ${{ secrets.GREATHOST_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}    
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python greathost.py

      # 5. 更新 README 到仓库
      - name: Push README changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: update renewal status [skip ci]" || exit 0
          git push

      # 6. 上传调试截图 (如果脚本里有 save_screenshot 的话)
      - name: Upload Error Page
        if: failure() # 仅在脚本报错失败时执行
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_page.html
          retention-days: 3 # 保存3天

      - name: 🧹 清理旧的工作流运行记录
        uses: MajorScruffy/delete-old-workflow-runs@v0.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          older-than-seconds: 3600  # 删除1小时前的记录   
